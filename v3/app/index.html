<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>US Districts</title>
  </head>
  <body data-layout="map">
    <div id="map"></div>
    <header class="top">
      <h1>US Districts</h1>
      <div class="filters" id="institution" role="group" aria-label="Institution"></div>
    </header>
    <div class="years" id="years" role="group" aria-label="Year"></div>
    <button type="button" class="glass layout" id="layout" aria-label="Map or list">List</button>
    <button type="button" class="glass" id="fmt" aria-label="Percent or count">%</button>
    <section class="sheet" id="sheet" aria-label="Results">
      <div class="geo-band">
        <div class="filters" id="geography" role="group" aria-label="Geography"></div>
        <input id="state" class="state" maxlength="2" inputmode="text" aria-label="State" placeholder="ST" />
      </div>
      <ol id="list"></ol>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
